<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حساب المخازن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: a ledger. One column, ruled rows, figures set apart in mono; money total leads the page. */
:root{
  --bg:#EFF2EE; --surface:#FFFFFF; --ink:#14221C; --muted:#5E6F66; --line:#D9E0DB; --field:#F5F8F5;
  --accent:#0E6B53; --accent-ink:#FFFFFF; --accent-soft:#DCEEE7;
  --warn:#8F5600; --warn-soft:#FAEED4; --bad:#B3261E;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211C; --ink:#E5EDE8; --muted:#8FA297; --line:#263530; --field:#101A16;
    --accent:#55C7A3; --accent-ink:#06261C; --accent-soft:#17352B;
    --warn:#E3B05A; --warn-soft:#33270F; --bad:#F2877F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E5EDE8; --muted:#8FA297; --line:#263530; --field:#101A16;
  --accent:#55C7A3; --accent-ink:#06261C; --accent-soft:#17352B;
  --warn:#E3B05A; --warn-soft:#33270F; --bad:#F2877F; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 72px; direction:rtl;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.sub{color:var(--muted);font-size:13px}
.msg{color:var(--muted);padding:48px 8px;text-align:center}

/* home */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 6px}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;letter-spacing:0}
.hero{padding:14px 0 18px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0;color:var(--muted);font-size:13px;letter-spacing:.02em}
.big{margin:2px 0 0;font-size:40px;line-height:1.15;font-weight:500;color:var(--accent);display:flex;align-items:baseline;gap:8px}
.big small{font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:400}
.mini{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;color:var(--muted);font-size:13px}
.mini b{color:var(--ink);font-weight:500}
.notice{margin:14px 0 0;padding:10px 12px;background:var(--warn-soft);color:var(--warn);border-radius:8px;font-size:13.5px}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:26px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ledger{list-style:none;margin:0;padding:0}
.ledger li+li{border-top:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;padding:14px 14px;background:none;border:0;text-align:right}
.wrow:active{background:var(--field)}
.wn{display:flex;flex-direction:column;min-width:0}
.wn b{font-weight:600;overflow-wrap:anywhere}
.wv{display:flex;flex-direction:column;align-items:flex-end}
.amt{font-size:18px;font-weight:500}
.chev{color:var(--muted);font-size:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;margin-top:10px}
.ghost{background:none;border:0;padding:8px 6px;color:var(--accent);font-weight:500}
.ghost.on{background:var(--accent-soft);border-radius:8px;padding-inline:12px}
.form{display:grid;gap:10px;padding:14px}
.form label,.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.inp{height:42px;padding:0 10px;border:1px solid var(--line);background:var(--field);border-radius:8px;width:100%;min-width:0;color:var(--ink)}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.snaprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 14px;align-items:center}
.snaprow+.snaprow{border-top:1px solid var(--line)}
.snaprow .inp{height:38px}
.snaprow .meta2{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--muted)}
.snaprow .meta2 label{display:flex;align-items:center;gap:6px}
.snaprow .meta2 input[type=date]{height:34px;width:auto;max-width:100%}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0}

/* warehouse */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar h2{flex:1;margin:0;text-align:center;font-family:var(--f-display);font-weight:600;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.figs{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;padding:16px 0 6px}
.figs div{display:flex;flex-direction:column;min-width:0}
.figs .lab{font-size:12.5px;color:var(--muted)}
.figs b{font-size:19px;font-weight:500}
.figs .main b{color:var(--accent);font-size:22px}
.figs .unit{font-size:12px;color:var(--muted)}
.note{margin:0 0 10px;font-size:13px;color:var(--muted)}
.snapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.snapbar .lab{font-size:13px;color:var(--muted);margin-inline-end:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:6px 12px;align-items:center;padding:12px 14px}
.item+.item{border-top:1px solid var(--line)}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .sub,.item .res{display:block}
.item .res{font-size:13.5px;margin-top:1px}
.item .res .num{font-weight:500}
.item .warn{display:block;color:var(--warn);font-size:12.5px;margin-top:2px}
.cnt{height:46px;width:88px;text-align:center;font-family:var(--f-num);font-size:18px;border:1px solid var(--line);background:var(--field);border-radius:8px;direction:ltr;color:var(--ink)}
.cnt.filled{border-color:var(--accent);background:var(--accent-soft)}
.cnt::placeholder{color:var(--muted);opacity:.55}
.item.edit{grid-template-columns:minmax(0,1fr) 92px auto;}
.item.edit .inp{height:40px}
.item.edit .x{background:none;border:0;color:var(--bad);padding:8px 4px;font-size:13px}
.item.add{grid-template-columns:minmax(0,1fr) 92px auto}
.mvs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.mvchip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:1px 10px;font-size:12.5px}
.mvbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:3px 2px}
.mvform{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mvform .inp{flex:1 1 90px;width:auto;height:38px}
.mvform .btn{padding:7px 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.94}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.backlink{display:inline-flex;align-items:center;gap:4px;margin-top:10px;padding:6px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:14px;text-decoration:none}
</style>

</head>
<body>
<div class="wrap" id="app"><p class="msg">جاري تحميل الحسابات…</p></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var AR='٠١٢٣٤٥٦٧٨٩', FA='۰۱۲۳۴۵۶۷۸۹';
  function toAscii(s){return String(s).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/[۰-۹]/g,function(d){return FA.indexOf(d)})}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
  function fm(n){n=Number(n)||0;if(Math.abs(n)<0.005)n=0;return nf.format(Math.round(n*100)/100)}
  function clone(o){return JSON.parse(JSON.stringify(o))}

  var app=document.getElementById('app'), toastEl=document.getElementById('toast');
  var db=null, S={snaps:[],whs:{},cfgExists:false,cfgLoaded:false,whLoaded:false};
  var mvOpen=null, view='home', editMode=false, editSnap=null, confirmKey=null, addingWh=false, pendingRender=false;
  var DEFAULT_SNAP={id:'s1',name:'ستوك ١',date:'',restock:false};

  /* ---------- toast ---------- */
  var toastT=null;
  function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);if(ms)toastT=setTimeout(function(){toastEl.classList.remove('show')},ms)}

  /* ---------- saving: one write at a time per document ---------- */
  var q={};
  function isDirty(p){var e=q[p];return !!e&&(e.pending||e.busy)}
  function anyDirty(){return Object.keys(q).some(isDirty)}
  function dataFor(p){
    if(p==='cfg/main')return {snaps:clone(S.snaps)};
    var id=p.slice(3);return S.whs[id]?clone(S.whs[id]):null;
  }
  function save(p){
    var e=q[p]||(q[p]={});e.pending=true;clearTimeout(e.t);
    e.t=setTimeout(function(){flush(p)},450);toast('بيحفظ…',0);
  }
  function flush(p){
    var e=q[p];if(!db)return;
    if(e.busy){e.again=true;return}
    e.busy=true;e.pending=false;
    (function run(){
      e.again=false;var d=dataFor(p);
      var op=d===null?db.doc(p).delete():db.doc(p).set(d);
      op.then(function(){
        if(e.again){run();return}
        e.busy=false;
        if(!anyDirty())toast('اتحفظ',1400);
      },function(){
        e.busy=false;e.pending=true;
        toast('ما اتحفظش. اتأكد من النت واكتب تاني',0);
      });
    })();
  }

  /* ---------- calculation ---------- */
  function adjOf(it){var a=0;(it.m||[]).forEach(function(x){a+=Number(x.a)||0});return a}
  function calc(w){
    var f=1-(Number(w.disc)||0)/100, sold=0,gross=0,net=0,anom=0,stockNow=0;
    var rows=w.items.map(function(it){
      var open=null,last=null,s=0,up=0,n=0,adj=adjOf(it),base=null;
      S.snaps.forEach(function(sn,k){
        var v=it.c&&it.c[sn.id];if(typeof v!=='number')return;
        if(k===0)open=v;else last=v;
      });
      if(open!==null){base=open+adj;n=1;if(last!==null){s=base-last;n=2;if(s<0)up=-s}}
      var g=s*(Number(it.p)||0);
      sold+=s;gross+=g;net+=g*f;if(up>0)anom++;
      var cur=last!==null?last:(base!==null?base:0);stockNow+=cur*(Number(it.p)||0);
      return {s:s,g:g,net:g*f,up:up,n:n,last:last,open:open,adj:adj,base:base};
    });
    return {rows:rows,sold:sold,gross:gross,net:net,anom:anom,stockNow:stockNow};
  }
  function whIds(){return Object.keys(S.whs).sort(function(a,b){return (S.whs[a].o||0)-(S.whs[b].o||0)})}
  function prevCount(it,snapId){
    var idx=S.snaps.findIndex(function(s){return s.id===snapId}),v=null;
    for(var k=0;k<idx;k++){var x=it.c&&it.c[S.snaps[k].id];if(typeof x==='number')v=x}
    return v;
  }
  function ensureEditSnap(){
    if(!S.snaps.some(function(s){return s.id===editSnap}))editSnap=S.snaps.length?S.snaps[S.snaps.length-1].id:null;
  }

  /* ---------- views ---------- */
  function resHTML(r,it){
    var out='';
    if(r.n<2)out='<span class="sub">'+(r.open===null?'اكتب ستوك أول الشهر':'اكتب الستوك الحالي عشان يتحسب')+'</span>';
    else out='مباع <span class="num">'+fm(r.s)+'</span> · <span class="num">'+fm(r.net)+'</span> ج.م';
    if(r.up>0)out+='<span class="warn">الحالي أكبر من الأساسي بـ '+fm(r.up)+'. لو وصلت بضاعة سجّلها توريد</span>';
    return out;
  }
  function subHTML(it,r){
    var t='السعر <span class="num">'+fm(it.p)+'</span>';
    if(r.base!==null){t+=' · الأساسي <span class="num">'+fm(r.base)+'</span>';if(r.adj)t+=' <span class="num">('+fm(r.open)+(r.adj>0?' + ':' − ')+fm(Math.abs(r.adj))+')</span>'}
    if(r.last!==null)t+=' · الحالي <span class="num">'+fm(r.last)+'</span>';
    return t;
  }

  function homeHTML(){
    var ids=whIds(),net=0,gross=0,sold=0,anom=0;
    var rows=ids.map(function(id){
      var w=S.whs[id],c=calc(w);net+=c.net;gross+=c.gross;sold+=c.sold;anom+=c.anom;
      return '<li><button type="button" class="wrow" data-act="open" data-id="'+esc(id)+'"><span class="wn"><b>'+esc(w.name)+'</b><span class="sub">'+w.items.length+' صنف · خصم <span class="num">'+fm(w.disc||0)+'</span>٪</span></span><span class="wv"><span class="num amt">'+fm(c.net)+'</span><span class="sub">ج.م</span></span><span class="chev" aria-hidden="true">‹</span></button></li>';
    }).join('');
    var h='<a class="backlink" href="index.html">→ التقارير</a><header class="top"><h1>حساب المخازن</h1></header>';
    if(ids.length){
      h+='<section class="hero"><p class="eyebrow">المستحق من كل المخازن</p><p class="big num">'+fm(net)+'<small>ج.م</small></p>'+
        '<div class="mini"><span>قبل الخصم <b class="num">'+fm(gross)+'</b></span><span>قطع مباعة <b class="num">'+fm(sold)+'</b></span></div></section>';
      if(anom)h+='<p class="notice">'+anom+' صنف الستوك الحالي بتاعه أكبر من الأساسي. لو وصلت بضاعة، سجّلها «توريد» على الصنف جوه المخزن.</p>';
    }
    h+='<h2 class="sec">المخازن</h2>';
    if(ids.length)h+='<div class="panel"><ul class="ledger">'+rows+'</ul></div>';
    else h+='<div class="panel"><p class="msg">لسه مفيش مخازن. ضيف أول مخزن وبعدين أصنافه وأسعارها.</p></div>';
    if(addingWh){
      h+='<form class="panel form" id="addWhForm" style="margin-top:10px"><div class="row2"><label class="fld">اسم المخزن<input class="inp" id="newWhName" autocomplete="off"></label><label class="fld">الخصم ٪<input class="inp num" id="newWhDisc" inputmode="decimal" value="25"></label></div>'+
        (ids.length?'<p class="hint" style="margin:0">هتتنسخ له أصناف وأسعار «'+esc(S.whs[ids[0]].name)+'» وتقدر تعدلها.</p>':'')+
        '<div class="actions"><button type="submit" class="btn primary">إضافة المخزن</button><button type="button" class="btn" data-act="add-wh-cancel">إلغاء</button></div></form>';
    }else h+='<button type="button" class="btn wide" data-act="add-wh">+ مخزن جديد</button>';

    h+='<h2 class="sec">الجرد</h2><div class="panel">';
    S.snaps.forEach(function(sn,k){
      var key='del-snap:'+sn.id;
      h+='<div class="snaprow"><input class="inp" data-sn="'+esc(sn.id)+'" data-k="name" value="'+esc(sn.name)+'" aria-label="اسم الجرد">'+
        (S.snaps.length>1?'<button type="button" class="btn danger" data-act="del-snap" data-id="'+esc(sn.id)+'">'+(confirmKey===key?'تأكيد الحذف':'حذف')+'</button>':'<span></span>')+
        '<div class="meta2"><label>التاريخ <input class="inp" type="date" data-sn="'+esc(sn.id)+'" data-k="date" value="'+esc(sn.date||'')+'"></label>'+
        (k>0?'<span>جرد خلال الشهر</span>':'<span>المرجع الثابت: ستوك أول الشهر</span>')+'</div></div>';
    });
    h+='</div><button type="button" class="btn wide" data-act="add-snap">+ جرد جديد</button>'+
      '<p class="hint">المباع = (ستوك أول الشهر + التوريد − المرتجع) − الستوك الحالي. الحالي هو آخر جرد مكتوب للصنف، والصنف اللي مكتوبش له رقم في جرد بيتخطّى ومبيتحسبش صفر.</p>';
    return h;
  }

  function mvHTML(it,i){
    var h='<div class="mvs">';
    (it.m||[]).forEach(function(x,j){
      var key='mv-del:'+i+':'+j,a=Number(x.a)||0;
      h+='<button type="button" class="mvchip" data-act="mv-del" data-id="'+i+':'+j+'">'+(confirmKey===key?'حذف؟':(a>0?'+':'−')+fm(Math.abs(a))+(a>0?' توريد':' مرتجع'))+'</button>';
    });
    h+='<button type="button" class="mvbtn" data-act="mv-open" data-i="'+i+'">'+(mvOpen===i?'إغلاق':'+ توريد أو مرتجع')+'</button></div>';
    if(mvOpen===i)h+='<div class="mvform"><input class="inp num" id="mvAmt" inputmode="numeric" placeholder="الكمية" autocomplete="off" aria-label="الكمية"><button type="button" class="btn" data-act="mv-add" data-i="'+i+'" data-sign="1">توريد +</button><button type="button" class="btn" data-act="mv-add" data-i="'+i+'" data-sign="-1">مرتجع −</button></div>';
    return h;
  }
  function whHTML(id){
    var w=S.whs[id],c=calc(w);ensureEditSnap();
    var h='<div class="bar"><button type="button" class="ghost" data-act="back">→ المخازن</button><h2>'+esc(w.name)+'</h2><button type="button" class="ghost'+(editMode?' on':'')+'" data-act="edit">'+(editMode?'تم':'تعديل')+'</button></div>';
    h+='<section class="figs"><div><span class="lab">مباع</span><b class="num" id="f-sold">'+fm(c.sold)+'</b><span class="unit">قطعة</span></div>'+
      '<div><span class="lab">قبل الخصم</span><b class="num" id="f-gross">'+fm(c.gross)+'</b><span class="unit">ج.م</span></div>'+
      '<div class="main"><span class="lab">الصافي بعد خصم <span class="num">'+fm(w.disc||0)+'</span>٪</span><b class="num" id="f-net">'+fm(c.net)+'</b><span class="unit">ج.م</span></div></section>'+
      '<p class="note">قيمة الباقي في المخزن بالسعر: <span class="num" id="f-stock">'+fm(c.stockNow)+'</span> ج.م</p>';
    if(editMode){
      h+='<section class="panel form"><label class="fld">اسم المخزن<input class="inp" id="whName" value="'+esc(w.name)+'"></label>'+
        '<label class="fld">الخصم ٪<input class="inp num" id="whDisc" inputmode="decimal" value="'+esc(w.disc==null?25:w.disc)+'"></label>'+
        '<button type="button" class="btn danger" data-act="del-wh" data-id="'+esc(id)+'">'+(confirmKey==='del-wh:'+id?'تأكيد حذف المخزن':'حذف المخزن')+'</button></section>';
      h+='<h2 class="sec">الأصناف والأسعار</h2><div class="panel"><ul class="items">';
      w.items.forEach(function(it,i){
        h+='<li class="item edit" data-i="'+i+'"><input class="inp f-name" data-i="'+i+'" value="'+esc(it.n)+'" aria-label="اسم الصنف"><input class="inp num f-price" data-i="'+i+'" inputmode="decimal" value="'+esc(it.p)+'" aria-label="السعر">'+
          '<button type="button" class="x" data-act="del-item" data-i="'+i+'">'+(confirmKey==='del-item:'+i?'تأكيد':'حذف')+'</button></li>';
      });
      h+='<li class="item add"><input class="inp" id="newName" placeholder="صنف جديد" autocomplete="off"><input class="inp num" id="newPrice" inputmode="decimal" placeholder="السعر"><button type="button" class="btn primary" data-act="add-item">إضافة</button></li></ul></div>';
      return h;
    }
    h+='<div class="snapbar"><span class="lab">اكتب جرد:</span>';
    S.snaps.forEach(function(sn,k){h+='<button type="button" class="chip'+(sn.id===editSnap?' on':'')+'" data-act="snap" data-id="'+esc(sn.id)+'">'+esc(sn.name)+(k===0?' · أول الشهر':'')+'</button>'});
    h+='<button type="button" class="chip" data-act="add-snap">+ جديد</button></div>';
    if(!w.items.length)h+='<div class="panel"><p class="msg">مفيش أصناف. دوس «تعديل» وضيف الأصناف.</p></div>';
    else{
      h+='<div class="panel"><ul class="items">';
      w.items.forEach(function(it,i){
        var r=c.rows[i],cur=it.c&&it.c[editSnap],pv=prevCount(it,editSnap);
        h+='<li class="item" data-i="'+i+'"><div><span class="nm">'+esc(it.n)+'</span><span class="sub">'+subHTML(it,r)+'</span><span class="res">'+resHTML(r,it)+'</span>'+mvHTML(it,i)+'</div>'+
          '<input class="cnt'+(typeof cur==='number'?' filled':'')+'" data-i="'+i+'" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="ستوك '+esc(it.n)+'" placeholder="'+(pv===null?'':pv)+'" value="'+(typeof cur==='number'?cur:'')+'"></li>';
      });
      h+='</ul></div>';
    }
    return h;
  }

  function render(){
    var y=window.scrollY;
    if(!db){app.innerHTML='<p class="msg">المتصفح مانع حفظ البيانات. جرب متصفح تاني أو اقفل التصفح الخاص.</p>';return}
    if(!(S.cfgLoaded&&S.whLoaded)){app.innerHTML='<p class="msg">جاري تحميل الحسابات…</p>';return}
    if(!S.snaps.length)S.snaps=[clone(DEFAULT_SNAP)];
    if(view!=='home'&&!S.whs[view]){view='home';editMode=false}
    app.innerHTML=view==='home'?homeHTML():whHTML(view);
    window.scrollTo(0,y);
  }
  function rerender(){
    var a=document.activeElement;
    if(a&&a.tagName==='INPUT'&&app.contains(a)){pendingRender=true;return}
    render();
  }
  function go(v){view=v;editMode=false;confirmKey=null;mvOpen=null;render();window.scrollTo(0,0)}

  function setT(id,v){var el=document.getElementById(id);if(el)el.textContent=v}
  function updateDetail(){
    var w=S.whs[view];if(!w)return;var c=calc(w);
    setT('f-sold',fm(c.sold));setT('f-gross',fm(c.gross));setT('f-net',fm(c.net));setT('f-stock',fm(c.stockNow));
    c.rows.forEach(function(r,i){
      var li=app.querySelector('.item[data-i="'+i+'"]');if(!li)return;
      var res=li.querySelector('.res'),sub=li.querySelector('.sub');
      if(res)res.innerHTML=resHTML(r,w.items[i]);
      if(sub)sub.innerHTML=subHTML(w.items[i],r);
    });
  }

  /* ---------- mutations ---------- */
  function ensureCfg(){if(!S.cfgExists){S.cfgExists=true;if(!S.snaps.length)S.snaps=[clone(DEFAULT_SNAP)];save('cfg/main')}}
  function addSnap(){
    var mx=0;S.snaps.forEach(function(s){var n=parseInt(String(s.id).slice(1),10);if(n>mx)mx=n});
    var id='s'+(mx+1);S.snaps.push({id:id,name:'ستوك '+(mx+1),date:'',restock:false});
    S.cfgExists=true;save('cfg/main');editSnap=id;
  }
  function delSnap(id){
    S.snaps=S.snaps.filter(function(s){return s.id!==id});save('cfg/main');
    Object.keys(S.whs).forEach(function(k){
      var changed=false;S.whs[k].items.forEach(function(it){if(it.c&&id in it.c){delete it.c[id];changed=true}});
      if(changed)save('wh/'+k);
    });
    if(editSnap===id)editSnap=null;
  }
  function addWh(name,disc){
    ensureCfg();
    var ids=whIds(),mx=0;ids.forEach(function(k){if((S.whs[k].o||0)>mx)mx=S.whs[k].o||0});
    var id='w'+Date.now().toString(36);
    var items=ids.length?S.whs[ids[0]].items.map(function(it){return {n:it.n,p:it.p,c:{}}}):[];
    S.whs[id]={name:name,disc:disc,o:mx+1,items:items};save('wh/'+id);return id;
  }
  function confirm2(key){
    if(confirmKey===key){confirmKey=null;return true}
    confirmKey=key;render();return false;
  }
  function cleanDigits(t,dot){
    var v=toAscii(t.value);v=dot?v.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1'):v.replace(/[^0-9]/g,'');
    if(v!==t.value)t.value=v;return v;
  }

  /* ---------- events ---------- */
  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b){if(confirmKey){confirmKey=null;render()}return}
    var act=b.dataset.act,id=b.dataset.id,i=b.dataset.i,w=S.whs[view];
    if(confirmKey&&confirmKey!==act+':'+(id||i||'')){confirmKey=null;render()}
    switch(act){
      case 'open':go(id);break;
      case 'back':go('home');break;
      case 'edit':editMode=!editMode;confirmKey=null;render();break;
      case 'snap':editSnap=id;render();break;
      case 'mv-open':mvOpen=(mvOpen===Number(i))?null:Number(i);render();var mvIn=document.getElementById('mvAmt');if(mvIn)mvIn.focus();break;
      case 'mv-add':
        var mvEl=document.getElementById('mvAmt'),amt=Number(toAscii(mvEl?mvEl.value:''))||0;
        if(!amt){if(mvEl)mvEl.focus();break}
        var itx=w.items[Number(i)];itx.m=itx.m||[];itx.m.push({a:amt*Number(b.dataset.sign)});
        mvOpen=null;save('wh/'+view);render();break;
      case 'mv-del':
        var pp=id.split(':');
        if(confirm2('mv-del:'+id)){w.items[Number(pp[0])].m.splice(Number(pp[1]),1);save('wh/'+view);render()}break;
      case 'add-snap':addSnap();render();break;
      case 'del-snap':
        if(S.snaps.length<2)break;
        if(confirm2('del-snap:'+id)){delSnap(id);render()}break;
      case 'add-wh':addingWh=true;render();var f=document.getElementById('newWhName');if(f)f.focus();break;
      case 'add-wh-cancel':addingWh=false;render();break;
      case 'del-wh':
        if(confirm2('del-wh:'+id)){delete S.whs[id];save('wh/'+id);go('home')}break;
      case 'add-item':
        var nm=document.getElementById('newName'),pr=document.getElementById('newPrice');
        if(!nm||!nm.value.trim()){if(nm)nm.focus();break}
        w.items.push({n:nm.value.trim(),p:Number(toAscii(pr.value))||0,c:{}});save('wh/'+view);render();
        var nn=document.getElementById('newName');if(nn)nn.focus();break;
      case 'del-item':
        if(confirm2('del-item:'+i)){w.items.splice(Number(i),1);save('wh/'+view);render()}break;
    }
  });
  app.addEventListener('submit',function(e){
    e.preventDefault();
    if(e.target.id==='addWhForm'){
      var name=document.getElementById('newWhName').value.trim();
      if(!name){document.getElementById('newWhName').focus();return}
      var d=Number(toAscii(document.getElementById('newWhDisc').value));if(!isFinite(d)||d<0||d>100)d=25;
      addingWh=false;var id=addWh(name,d);go(id);
    }
  });
  app.addEventListener('input',function(e){
    var t=e.target,w=S.whs[view];
    if(t.classList.contains('cnt')&&w){
      var v=cleanDigits(t,false),it=w.items[Number(t.dataset.i)];
      it.c=it.c||{};
      if(v==='')delete it.c[editSnap];else it.c[editSnap]=Number(v);
      t.classList.toggle('filled',v!=='');save('wh/'+view);updateDetail();
    }else if(t.classList.contains('f-name')&&w){w.items[Number(t.dataset.i)].n=t.value;save('wh/'+view)}
    else if(t.classList.contains('f-price')&&w){var p=cleanDigits(t,true);w.items[Number(t.dataset.i)].p=Number(p)||0;save('wh/'+view);updateDetail()}
    else if(t.id==='whName'&&w){w.name=t.value;save('wh/'+view)}
    else if(t.id==='whDisc'&&w){var dv=cleanDigits(t,true);var n=Number(dv);w.disc=isFinite(n)&&n<=100?n:0;save('wh/'+view);updateDetail()}
    else if(t.dataset.sn){
      var sn=S.snaps.find(function(s){return s.id===t.dataset.sn});if(!sn)return;
      if(t.dataset.k==='name'){sn.name=t.value}
      else if(t.dataset.k==='date'){sn.date=t.value}
      else return;
      save('cfg/main');
    }else if(t.id==='mvAmt'){cleanDigits(t,false)}else if(t.id==='newWhDisc'||t.id==='newPrice'){cleanDigits(t,true)}
  });
  app.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset&&t.dataset.k==='restock'){
      var sn=S.snaps.find(function(s){return s.id===t.dataset.sn});if(!sn)return;
      sn.restock=t.checked;save('cfg/main');render();
    }
  });
  app.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var t=e.target;
    if(t.classList&&t.classList.contains('cnt')){
      e.preventDefault();
      var all=[].slice.call(app.querySelectorAll('.cnt')),k=all.indexOf(t);
      if(all[k+1])all[k+1].focus();else t.blur();
    }
  });
  app.addEventListener('focusout',function(){
    setTimeout(function(){
      var a=document.activeElement;
      if(pendingRender&&!(a&&a.tagName==='INPUT'&&app.contains(a))){pendingRender=false;render()}
    },0);
  });

  /* ---------- data ---------- */
  function onErr(){toast('حصلت مشكلة في تحميل البيانات',0)}
  function start(d){
    db=d;render();
    if(!db)return;
    db.doc('cfg/main').onSnapshot(function(snap){
      if(isDirty('cfg/main')){return}
      S.cfgLoaded=true;S.cfgExists=snap.exists;
      if(snap.exists){var x=snap.data()||{};S.snaps=(x.snaps||[]).map(function(s){return {id:s.id,name:s.name,date:s.date||'',restock:!!s.restock}})}
      rerender();
    },onErr);
    db.collection('wh').onSnapshot(function(snap){
      var next={};
      snap.docs.forEach(function(d){
        var id=d.id;
        if(isDirty('wh/'+id)){if(S.whs[id])next[id]=S.whs[id];return}
        next[id]=clone(d.data());
      });
      Object.keys(S.whs).forEach(function(id){if(isDirty('wh/'+id)&&!next[id])next[id]=S.whs[id]});
      S.whs=next;S.whLoaded=true;rerender();
    },onErr);
  }

"s4":5},"m":[{"a":8}],"n":"بيوروتس لوشن","p":350},{"c":{"s1":2,"s2":2,"s3":10},"m":[{"a":8}],"n":"بيوروتس امبولات","p":390},{"c":{"s1":3,"s2":3,"s3":10},"m":[{"a":7}],"n":"بيوروتس شامبو","p":225},{"c":{"s1":2,"s2":2,"s3":10},"m":[{"a":8}],"n":"ديفو اي كونتور","p":300},{"c":{"s1":2,"s2":2,"s3":10},"m":[{"a":8}],"n":"ديفو سيرم","p":350},{"c":{"s1":5,"s2":4,"s3":10},"m":[{"a":6}],"n":"ديفو غسول","p":250},{"c":{"s1":8,"s2":7,"s3":10},"m":[{"a":3}],"n":"بيلوسترونج زيت","p":225},{"c":{"s1":4,"s2":2,"s3":10},"m":[{"a":8}],"n":"بيلوسترونج كريم","p":325},{"c":{"s1":14,"s2":11,"s3":10},"m":[{"a":-1}],"n":"فيرلاين","p":350}],"name":"مخزن بونص","o":4},"wh/w5":{"disc":23,"items":[{"c":{"s1":1,"s2":1,"s3":10,"s4":5},"m":[{"a":9}],"n":"بيوروتس لوشن","p":350},{"c":{"s1":3,"s2":3,"s3":10},"m":[{"a":7}],"n":"بيوروتس امبولات","p":720},{"c":{"s1":8,"s2":8,"s3":10},"m":[{"a":2}],"n":"بيوروتس شامبو","p":225},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"ديفو اي كونتور","p":300},{"c":{"s1":4,"s2":4,"s3":10},"m":[{"a":6}],"n":"ديفو سيرم","p":350},{"c":{"s1":4,"s2":0,"s3":10},"m":[{"a":10}],"n":"ديفو غسول","p":250},{"c":{"s1":6,"s2":6,"s3":10},"m":[{"a":4}],"n":"بيلوسترونج زيت","p":200},{"c":{"s1":4,"s2":2,"s3":10},"m":[{"a":8}],"n":"بيلوسترونج كريم","p":325},{"c":{"s1":6,"s2":6,"s3":10},"m":[{"a":4}],"n":"فيرلاين","p":350}],"name":"مخزن الدولية","o":5},"wh/w6":{"disc":25,"items":[{"c":{"s1":0,"s2":0,"s3":10,"s4":5},"m":[{"a":10}],"n":"بيوروتس لوشن","p":350},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"بيوروتس امبولات","p":390},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"بيوروتس شامبو","p":240},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"ديفو اي كونتور","p":300},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"ديفو سيرم","p":350},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"ديفو غسول","p":250},{"c":{"s1":0,"s2":0,"s3":10},"m":[{"a":10}],"n":"بيلوسترونج زيت","p":250},{"c":{"s1":22,"s2":17,"s3":10},"m":[{"a":-7}],"n":"بيلوسترونج كريم","p":325},{"c":{"s1":19,"s2":9,"s3":10},"m":[{"a":1}],"n":"فيرلاين","p":350}],"name":"مخزن نيفين","o":6}};
  function makeLocalDb(){
    var store=null;
    try{var raw=localStorage.getItem(KEY);if(raw)store=JSON.parse(raw)}catch(e){}
    if(!store)store=JSON.parse(JSON.stringify(SEED));
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){return Promise.reject(e)}return Promise.resolve()}
    persist().catch(function(){});
    function snap(id,p){return {id:id,exists:!!store[p],data:function(){return store[p]},metadata:{fromCache:false,hasPendingWrites:false}}}
    return {
      doc:function(p){return {
        onSnapshot:function(cb){setTimeout(function(){cb(snap(p.split('/').pop(),p))},0);return function(){}},
        set:function(d){store[p]=JSON.parse(JSON.stringify(d));return persist()},
        delete:function(){delete store[p];return persist()}
      }},
      collection:function(c){return {
        onSnapshot:function(cb){setTimeout(function(){
          var docs=Object.keys(store).filter(function(k){return k.indexOf(c+'/')===0}).map(function(k){return snap(k.slice(c.length+1),k)});
          cb({docs:docs,size:docs.length,empty:!docs.length});
        },0);return function(){}}
      }}
    };
  }
  start(makeLocalDb());
})();
